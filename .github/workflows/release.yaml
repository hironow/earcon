name: release

# Publishes @earcon/* with npm Trusted Publishing (OIDC). No secrets are used.
# Tarballs come from `bun pm pack` (resolves workspace:/catalog:); the npm CLI
# from actions/setup-node (Node 24 → npm ≥ 11.5.1) only uploads them (ADR-0008).
# Bootstrap (first release, trusted publisher setup) is manual: docs/release.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    # Opens/updates the "Version Packages" PR while changesets are pending on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: bun install --frozen-lockfile
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1 (v2 input names)
        with:
          version-script: just release-version # changeset version + bun install --lockfile-only
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest # GitHub-hosted: required for Trusted Publishing
    timeout-minutes: 40
    # The `release` environment requires a reviewer's approval before this job runs
    # and only admits v* tags and main (same convention as firepact / tablecodec).
    environment:
      name: release
      url: https://www.npmjs.com/org/earcon
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv tool install semgrep==1.176.0
      # ubuntu-latest ships npm 10.9.x; Trusted Publishing needs npm ≥ 11.5.1 and Node ≥ 22.14.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0" # ships npm 11.19.0; bump deliberately
      - name: Check npm version for Trusted Publishing
        run: |
          node --version
          v=$(npm --version)
          echo "npm $v"
          # semver compare: the lowest of (installed, 11.5.1) must be 11.5.1
          if [ "$(printf '%s\n' "$v" 11.5.1 | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm >= 11.5.1 required for Trusted Publishing, got $v"; exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: just check
      - run: just build
      - run: just pack
      - name: Tag must match every package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in core engine-tone react; do
            v=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$v" != "$tag" ]; then echo "packages/$pkg is $v, tag is $tag"; exit 1; fi
          done
      - name: Publish tarballs (npm Trusted Publishing; provenance is added by npm)
        id: publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          # Idempotent: a version that is already on the registry (e.g. the manual
          # bootstrap release, or a re-run) is skipped instead of failing.
          published=0
          for pkg in core engine-tone react; do
            ver=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "@earcon/$pkg@$ver" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "@earcon/$pkg@$ver is already published, skipping"
              continue
            fi
            # "./" is required: npm treats "dist-pack/x.tgz" as a GitHub owner/repo shortcut.
            npm publish "./dist-pack/earcon-$pkg-$ver.tgz" --access public --registry https://registry.npmjs.org
            published=1
          done
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - name: Verify provenance attestations (npm's publish-time scan may delay visibility)
        if: ${{ steps.publish.outputs.published == '1' }}
        continue-on-error: true
        run: |
          ver=$(node -p "require('./packages/core/package.json').version")
          for i in $(seq 1 20); do
            ok=1
            for pkg in core engine-tone react; do
              npm view "@earcon/$pkg@$ver" dist.attestations --json --registry https://registry.npmjs.org | grep -q provenance || ok=0
            done
            if [ "$ok" = 1 ]; then echo "attestations present"; exit 0; fi
            sleep 45
          done
          echo "no provenance attestation visible after 15 minutes — check manually (docs/release.md)"
          exit 1
