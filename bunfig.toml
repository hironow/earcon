[test]
preload = ["./test/happydom.ts"]

[install]
# Supply-chain hygiene (ADR-0007): never resolve a version published less than 7 days ago,
# except our own packages. Applies to new resolutions only; bun.lock stays as is.
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = ["@earcon/core", "@earcon/engine-tone", "@earcon/react"]
