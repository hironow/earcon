name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install semgrep
      - run: bun install --frozen-lockfile
      - run: just lint
      - run: just test
      - run: just test-core
      - run: just build
      - run: just publish-dry

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: extractions/setup-just@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: just test-e2e
