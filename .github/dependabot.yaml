version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "bun"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # React requires an exact renderer version match. Put the family before
      # the generic development group so it also claims the two type packages.
      react-family:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      dev-dependencies:
        dependency-type: "development"
